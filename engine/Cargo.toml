[package]
name = "macwand-engine"
version = "0.1.0"
edition = "2021"
description = "Fast parallel disk scanner that streams cleanup findings as JSON lines"

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
