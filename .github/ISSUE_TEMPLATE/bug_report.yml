name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't report security vulnerabilities here; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Scan
        2. Open Build Artifacts
        3. …
    validations:
      required: true
  - type: input
    id: macwand-version
    attributes:
      label: MacWand version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "14.6"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac chip
      options:
        - Apple silicon
        - Intel
  - type: dropdown
    id: full-disk-access
    attributes:
      label: Does MacWand have Full Disk Access?
      options:
        - "Yes"
        - "No"
        - Not sure
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, the folder involved, and so on.
